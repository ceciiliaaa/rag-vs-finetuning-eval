<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1180" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <!-- ============ data sources ============ -->
  <rect x="410" y="16" width="360" height="76" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="590" y="48" text-anchor="middle" font-size="16" font-weight="600" fill="#212529">Social-media customer posts</text>
  <text x="590" y="72" text-anchor="middle" font-size="13.5" fill="#495057">Reddit, YouTube, brand forums (one shared corpus)</text>
  <path d="M590,92 L590,152" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ============ user ============ -->
  <rect x="24" y="206" width="128" height="124" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <g transform="translate(88,244)">
    <circle cx="0" cy="-12" r="15" fill="#212529"/>
    <path d="M-22,24 v-6 a22,22 0 0 1 44,0 v6 z" fill="#212529"/>
  </g>
  <text x="88" y="302" text-anchor="middle" font-size="16" font-weight="600" fill="#212529">User</text>

  <!-- ============ interface ============ -->
  <rect x="216" y="206" width="140" height="124" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <g transform="translate(286,242)">
    <rect x="-30" y="-22" width="60" height="42" rx="4" fill="#212529"/>
    <rect x="-26" y="-18" width="52" height="34" fill="#ffffff"/>
    <path d="M-14,-3 L0,-11 L14,-3 L0,7 Z" fill="#7a8ba6"/>
    <rect x="-7" y="20" width="14" height="5" fill="#212529"/>
    <rect x="-17" y="25" width="34" height="4" rx="2" fill="#212529"/>
  </g>
  <text x="286" y="298" text-anchor="middle" font-size="16" font-weight="600" fill="#212529">Streamlit</text>
  <text x="286" y="317" text-anchor="middle" font-size="13" fill="#495057">interface</text>

  <path d="M152,244 L210,244" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="181" y="236" text-anchor="middle" font-size="12.5" fill="#495057">question</text>
  <path d="M210,288 L154,288" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="182" y="305" text-anchor="middle" font-size="12.5" fill="#495057">answer</text>

  <!-- ============ knowledge integration ============ -->
  <rect x="410" y="152" width="360" height="216" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-dasharray="5 4"/>
  <text x="590" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#343a40">Knowledge integration</text>
  <text x="590" y="199" text-anchor="middle" font-size="12.5" fill="#6c757d">the only component that differs between the two variants</text>

  <rect x="440" y="216" width="300" height="60" rx="8" fill="#e9f0f7" stroke="#5b83b0"/>
  <text x="590" y="240" text-anchor="middle" font-size="15.5" font-weight="600" fill="#35618c">RAG pipeline</text>
  <text x="590" y="261" text-anchor="middle" font-size="12.5" fill="#35618c">retrieves five posts into the prompt at query time</text>

  <rect x="440" y="290" width="300" height="60" rx="8" fill="#f8eef4" stroke="#b57fa8"/>
  <text x="590" y="314" text-anchor="middle" font-size="15.5" font-weight="600" fill="#8a5478">Fine-tuning pipeline</text>
  <text x="590" y="335" text-anchor="middle" font-size="12.5" fill="#8a5478">posts trained into the model weights beforehand</text>

  <path d="M356,260 L404,260" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ============ generation model ============ -->
  <rect x="838" y="206" width="162" height="124" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <g transform="translate(919,242)">
    <path d="M0,-18 L-16,9 M0,-18 L16,9 M-16,9 L16,9 M0,-18 L0,9" stroke="#343a40" stroke-width="1.8" fill="none"/>
    <circle cx="0" cy="-18" r="5.4" fill="#343a40"/>
    <circle cx="-16" cy="9" r="5.4" fill="#343a40"/>
    <circle cx="16" cy="9" r="5.4" fill="#343a40"/>
    <circle cx="0" cy="9" r="5.4" fill="#343a40"/>
  </g>
  <text x="919" y="298" text-anchor="middle" font-size="15.5" font-weight="600" fill="#212529">GPT-3.5-Turbo</text>
  <text x="919" y="317" text-anchor="middle" font-size="13" fill="#495057">temperature 0.7</text>

  <path d="M740,246 L832,254" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M740,320 L832,286" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ============ answer ============ -->
  <rect x="1044" y="206" width="116" height="124" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="1102" y="273" text-anchor="middle" font-size="16" font-weight="600" fill="#212529">Answer</text>
  <path d="M1000,268 L1038,268" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M1102,330 L1102,412 L286,412 L286,336" stroke="#495057" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <text x="590" y="452" text-anchor="middle" font-size="13" fill="#6c757d">Identical corpus, interface and generation model, so measured differences are attributable to the knowledge-integration step.</text>
</svg>
