<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1180" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <!-- data source -->
  <rect x="430" y="24" width="320" height="62" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="590" y="49" text-anchor="middle" font-size="16" font-weight="600" fill="#212529">Social-media customer posts</text>
  <text x="590" y="70" text-anchor="middle" font-size="13.5" fill="#495057">Reddit, YouTube, brand forums (one shared corpus)</text>
  <path d="M590,86 L590,124" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- user -->
  <rect x="24" y="196" width="120" height="62" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="84" y="233" text-anchor="middle" font-size="16" font-weight="600" fill="#212529">User</text>

  <!-- ui -->
  <rect x="212" y="196" width="130" height="62" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="277" y="222" text-anchor="middle" font-size="16" font-weight="600" fill="#212529">Streamlit</text>
  <text x="277" y="242" text-anchor="middle" font-size="13.5" fill="#495057">interface</text>

  <path d="M144,215 L206,215" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="175" y="207" text-anchor="middle" font-size="12.5" fill="#495057">question</text>
  <path d="M206,241 L146,241" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="176" y="258" text-anchor="middle" font-size="12.5" fill="#495057">answer</text>

  <!-- knowledge integration -->
  <rect x="410" y="124" width="360" height="206" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-dasharray="5 4"/>
  <text x="590" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#343a40">Knowledge integration</text>
  <text x="590" y="169" text-anchor="middle" font-size="12.5" fill="#6c757d">the only component that differs between the two variants</text>

  <rect x="440" y="186" width="300" height="56" rx="8" fill="#e7f0f7" stroke="#1f4e79"/>
  <text x="590" y="208" text-anchor="middle" font-size="15.5" font-weight="600" fill="#12406b">RAG pipeline</text>
  <text x="590" y="228" text-anchor="middle" font-size="12.5" fill="#12406b">retrieves five posts into the prompt at query time</text>

  <rect x="440" y="256" width="300" height="56" rx="8" fill="#fbeceb" stroke="#a4342c"/>
  <text x="590" y="278" text-anchor="middle" font-size="15.5" font-weight="600" fill="#8c2b24">Fine-tuning pipeline</text>
  <text x="590" y="298" text-anchor="middle" font-size="12.5" fill="#8c2b24">posts trained into the model weights beforehand</text>

  <path d="M342,227 L404,227" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- llm -->
  <rect x="838" y="196" width="150" height="62" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="913" y="222" text-anchor="middle" font-size="15.5" font-weight="600" fill="#212529">GPT-3.5-Turbo</text>
  <text x="913" y="242" text-anchor="middle" font-size="12.5" fill="#495057">temperature 0.7</text>

  <path d="M740,214 L832,220" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M740,284 L832,240" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- answer -->
  <rect x="1032" y="196" width="124" height="62" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="1094" y="233" text-anchor="middle" font-size="16" font-weight="600" fill="#212529">Answer</text>
  <path d="M988,227 L1026,227" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M1094,258 L1094,376 L277,376 L277,264" stroke="#495057" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <text x="590" y="410" text-anchor="middle" font-size="13" fill="#6c757d">Identical corpus, interface and generation model, so measured differences are attributable to the knowledge-integration step.</text>
</svg>
