<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 250" width="1220" height="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1220" height="250" fill="#ffffff"/>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <rect x="20" y="52" width="196" height="118" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="118" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Prepared corpus</text>
  <text x="118" y="122" text-anchor="middle" font-size="13" fill="#495057">social-media posts</text>
  <text x="118" y="141" text-anchor="middle" font-size="13" fill="#495057">as a normalised CSV</text>

  <rect x="256" y="52" width="196" height="118" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="354" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Embedding</text>
  <text x="354" y="122" text-anchor="middle" font-size="13" fill="#495057">all-MiniLM-L6-v2,</text>
  <text x="354" y="141" text-anchor="middle" font-size="13" fill="#495057">384 dimensions</text>

  <rect x="492" y="52" width="212" height="118" rx="8" fill="#e7f0f7" stroke="#1f4e79"/>
  <text x="598" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#12406b">Vector search</text>
  <text x="598" y="122" text-anchor="middle" font-size="13" fill="#12406b">Pinecone index, cosine</text>
  <text x="598" y="141" text-anchor="middle" font-size="13" fill="#12406b">similarity, top k = 5</text>

  <rect x="744" y="52" width="212" height="118" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="850" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Prompt assembly</text>
  <text x="850" y="122" text-anchor="middle" font-size="13" fill="#495057">question plus the five</text>
  <text x="850" y="141" text-anchor="middle" font-size="13" fill="#495057">retrieved posts</text>

  <rect x="996" y="52" width="204" height="118" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="1098" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Generation</text>
  <text x="1098" y="122" text-anchor="middle" font-size="13" fill="#495057">GPT-3.5-Turbo,</text>
  <text x="1098" y="141" text-anchor="middle" font-size="13" fill="#495057">answer plus its sources</text>

  <path d="M216,111 L250,111" stroke="#495057" stroke-width="1.6" marker-end="url(#c)"/>
  <path d="M452,111 L486,111" stroke="#495057" stroke-width="1.6" marker-end="url(#c)"/>
  <path d="M704,111 L738,111" stroke="#495057" stroke-width="1.6" marker-end="url(#c)"/>
  <path d="M956,111 L990,111" stroke="#495057" stroke-width="1.6" marker-end="url(#c)"/>

  <text x="610" y="212" text-anchor="middle" font-size="13" fill="#6c757d">The five retrieved posts are displayed next to the answer. That display is what the transparency criterion measures.</text>
</svg>
