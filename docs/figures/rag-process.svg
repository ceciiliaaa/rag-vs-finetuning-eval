    <rect x="-8" y="-8" width="16" height="16" rx="2"/>
    <path d="M-9,-18 v-7 M0,-18 v-7 M9,-18 v-7 M-9,18 v7 M0,18 v7 M9,18 v7"/>
    <path d="M-18,-9 h-7 M-18,0 h-7 M-18,9 h-7 M18,-9 h7 M18,0 h7 M18,9 h7"/>
