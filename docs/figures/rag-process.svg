  <text x="362" y="312" font-size="12.5" fill="#111111"><tspan font-weight="700">Question:</tspan> How much horsepower</text>
  <text x="362" y="330" font-size="12.5" fill="#111111">does the AMG A 45 have?</text>
  <text x="362" y="364" font-size="12.5" font-weight="700" fill="#111111">Please answer the question using the</text>
  <text x="362" y="382" font-size="12.5" font-weight="700" fill="#111111">following information:</text>
  <text x="362" y="416" font-size="12.5" fill="#111111"><tspan font-weight="700">Chunk 1:</tspan> The AMG A is very fast</text>
  <text x="362" y="440" font-size="12.5" fill="#111111"><tspan font-weight="700">Chunk 2:</tspan> The AMG A 45 has 387 hp</text>
  <text x="362" y="464" font-size="12.5" fill="#111111"><tspan font-weight="700">Chunk 3:</tspan> Customers love the ...</text>

  <path d="M344,384 L308,384" stroke="#b07ab8" stroke-width="2.2" marker-end="url(#pur)"/>

  <!-- llm brain icon -->
  <g transform="translate(268,384)">
    <path d="M0,-30 C14,-35 30,-25 29,-9 C37,-3 36,11 26,15 C23,28 8,33 0,26 C-8,33 -23,28 -26,15 C-36,11 -37,-3 -29,-9 C-30,-25 -14,-35 0,-30 Z"
          fill="none" stroke="#a05fa8" stroke-width="2"/>
    <g stroke="#a05fa8" stroke-width="1.4">
      <path d="M0,-20 L-13,-6 M0,-20 L13,-6 M-13,-6 L-8,12 M13,-6 L8,12 M-8,12 L8,12 M-13,-6 L13,-6 M0,-20 L0,2 M0,2 L-8,12 M0,2 L8,12"/>
    </g>
    <g fill="#a05fa8">
      <circle cx="0" cy="-20" r="3.4"/>
      <circle cx="-13" cy="-6" r="3.4"/>
      <circle cx="13" cy="-6" r="3.4"/>
      <circle cx="0" cy="2" r="3.4"/>
      <circle cx="-8" cy="12" r="3.4"/>
      <circle cx="8" cy="12" r="3.4"/>
    </g>
