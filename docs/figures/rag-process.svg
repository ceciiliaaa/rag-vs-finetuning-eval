  <text x="845" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">relevant documents</text>

  <rect x="716" y="322" width="258" height="166" rx="4" fill="none" stroke="#cf9557" stroke-width="1.6" stroke-dasharray="6 4"/>
