<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -20 1040 554" width="1040" height="554" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="-18" y="-20" width="1040" height="554" fill="#ffffff"/>
  <defs>
    <marker id="blk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
    <marker id="blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f9fd8"/>
    </marker>
    <marker id="pur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b07ab8"/>
    </marker>
    <marker id="sm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- ============ user ============ -->
  <g transform="translate(105,80)">
    <circle cx="0" cy="-16" r="20" fill="#111111"/>
    <path d="M-30,32 v-8 a30,30 0 0 1 60,0 v8 z" fill="#111111"/>
  </g>
  <text x="105" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#111111">User</text>

  <path d="M190,100 L250,100" stroke="#111111" stroke-width="2.4" marker-end="url(#blk)"/>

  <!-- ============ question ============ -->
  <rect x="392" y="32" width="96" height="32" rx="6" fill="#d9d9d9"/>
  <text x="440" y="54" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Question</text>
  <rect x="352" y="74" width="176" height="58" rx="6" fill="#ededed"/>
  <text x="440" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">How much horsepower</text>
  <text x="440" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">does the AMG A 45 have?</text>

  <path d="M580,100 L640,100" stroke="#111111" stroke-width="2.4" marker-end="url(#blk)"/>

