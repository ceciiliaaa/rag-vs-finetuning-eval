  <rect x="46" y="240" width="106" height="32" rx="6" fill="#ecd9ee"/>
  <text x="99" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">Answer</text>
  <rect x="38" y="282" width="146" height="204" rx="4" fill="none" stroke="#b07ab8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="111" y="376" text-anchor="middle" font-size="14.5" font-weight="700" fill="#111111">“ The AMG A 45</text>
  <text x="111" y="398" text-anchor="middle" font-size="14.5" font-weight="700" fill="#111111">has 387 hp ”</text>

  <path d="M105,202 L105,160" stroke="#111111" stroke-width="2.4" marker-end="url(#blk)"/>
