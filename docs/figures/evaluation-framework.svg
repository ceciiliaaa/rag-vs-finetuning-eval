<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1240" height="470" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="86" y="32" text-anchor="middle" font-size="13.5" font-weight="700" fill="#343a40">Systems</text>
  <text x="300" y="32" text-anchor="middle" font-size="13.5" font-weight="700" fill="#343a40">Criteria</text>
  <text x="590" y="32" text-anchor="middle" font-size="13.5" font-weight="700" fill="#343a40">Data collection</text>
  <text x="895" y="32" text-anchor="middle" font-size="13.5" font-weight="700" fill="#343a40">Utility analysis</text>
  <text x="1148" y="32" text-anchor="middle" font-size="13.5" font-weight="700" fill="#343a40">Decision</text>

  <!-- systems -->
  <rect x="26" y="150" width="120" height="52" rx="8" fill="#e9f0f7" stroke="#5b83b0"/>
  <text x="86" y="182" text-anchor="middle" font-size="16" font-weight="600" fill="#35618c">RAG</text>
  <rect x="26" y="252" width="120" height="52" rx="8" fill="#f8eef4" stroke="#b57fa8"/>
  <text x="86" y="284" text-anchor="middle" font-size="16" font-weight="600" fill="#8a5478">Fine-tuning</text>

  <!-- criteria -->
  <rect x="180" y="56" width="240" height="330" rx="10" fill="#f8f9fa" stroke="#adb5bd"/>
  <rect x="200" y="76" width="200" height="42" rx="6" fill="#eceef0" stroke="#ced4da"/>
  <text x="300" y="103" text-anchor="middle" font-size="14.5" fill="#212529">Answer correctness</text>
  <rect x="200" y="128" width="200" height="42" rx="6" fill="#eceef0" stroke="#ced4da"/>
  <text x="300" y="155" text-anchor="middle" font-size="14.5" fill="#212529">Transparency</text>
  <rect x="200" y="180" width="200" height="42" rx="6" fill="#eceef0" stroke="#ced4da"/>
  <text x="300" y="207" text-anchor="middle" font-size="14.5" fill="#212529">Response time</text>
  <rect x="200" y="248" width="200" height="42" rx="6" fill="#eceef0" stroke="#ced4da"/>
  <text x="300" y="275" text-anchor="middle" font-size="14.5" fill="#212529">Recency</text>
  <rect x="200" y="300" width="200" height="42" rx="6" fill="#eceef0" stroke="#ced4da"/>
  <text x="300" y="327" text-anchor="middle" font-size="14.5" fill="#212529">Cost efficiency</text>
  <text x="300" y="368" text-anchor="middle" font-size="12.5" fill="#6c757d">five criteria, two scoring routes</text>

  <path d="M146,176 L174,176" stroke="#495057" stroke-width="1.6" marker-end="url(#b)"/>
  <path d="M146,278 L174,278" stroke="#495057" stroke-width="1.6" marker-end="url(#b)"/>

  <!-- collection -->
  <rect x="466" y="76" width="250" height="112" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="591" y="104" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Measured on the prototypes</text>
  <text x="591" y="128" text-anchor="middle" font-size="13" fill="#495057">15 test questions per system,</text>
  <text x="591" y="147" text-anchor="middle" font-size="13" fill="#495057">binary human judgement and</text>
  <text x="591" y="166" text-anchor="middle" font-size="13" fill="#495057">measured response times</text>

  <rect x="466" y="248" width="250" height="112" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="591" y="276" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Scored from the literature</text>
  <text x="591" y="300" text-anchor="middle" font-size="13" fill="#495057">binary sub-criteria assessed</text>
  <text x="591" y="319" text-anchor="middle" font-size="13" fill="#495057">against published evidence,</text>
  <text x="591" y="338" text-anchor="middle" font-size="13" fill="#495057">each with cited sources</text>

  <path d="M420,132 L460,132" stroke="#495057" stroke-width="1.6" marker-end="url(#b)"/>
  <path d="M420,304 L460,304" stroke="#495057" stroke-width="1.6" marker-end="url(#b)"/>

  <!-- utility analysis -->
  <rect x="770" y="56" width="250" height="330" rx="10" fill="#f8f9fa" stroke="#868e96"/>
  <rect x="792" y="80" width="206" height="66" rx="8" fill="#e9f0f7" stroke="#5b83b0"/>
  <text x="895" y="105" text-anchor="middle" font-size="14.5" font-weight="600" fill="#35618c">Stakeholder interviews</text>
  <text x="895" y="126" text-anchor="middle" font-size="12.5" fill="#35618c">five experts rank the criteria</text>
  <text x="895" y="140" text-anchor="middle" font-size="12.5" fill="#35618c">Kendall's W = 0.792</text>
  <path d="M895,146 L895,176" stroke="#495057" stroke-width="1.6" marker-end="url(#b)"/>

  <rect x="792" y="180" width="206" height="56" rx="8" fill="#eceef0" stroke="#ced4da"/>
  <text x="895" y="204" text-anchor="middle" font-size="14.5" font-weight="600" fill="#212529">Normalisation</text>
  <text x="895" y="224" text-anchor="middle" font-size="12.5" fill="#495057">all scores mapped to [0, 1]</text>
  <path d="M895,236 L895,266" stroke="#495057" stroke-width="1.6" marker-end="url(#b)"/>

  <rect x="792" y="270" width="206" height="56" rx="8" fill="#eceef0" stroke="#ced4da"/>
  <text x="895" y="294" text-anchor="middle" font-size="14.5" font-weight="600" fill="#212529">Weighted aggregation</text>
  <text x="895" y="314" text-anchor="middle" font-size="12.5" fill="#495057">N = Σ wⱼ · sⱼ</text>
  <text x="895" y="356" text-anchor="middle" font-size="12.5" fill="#6c757d">plus sensitivity analysis</text>

  <path d="M716,132 L744,132 L744,220 L764,220" stroke="#495057" stroke-width="1.6" fill="none" marker-end="url(#b)"/>
  <path d="M716,304 L744,304 L744,222" stroke="#495057" stroke-width="1.6" fill="none"/>

  <!-- decision -->
  <rect x="1064" y="150" width="150" height="154" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="1139" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Utility per</text>
  <text x="1139" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">system</text>
  <text x="1139" y="248" text-anchor="middle" font-size="14" fill="#35618c">RAG 0.8461</text>
  <text x="1139" y="272" text-anchor="middle" font-size="14" fill="#8a5478">Fine-tuning 0.4171</text>
  <path d="M1020,222 L1058,222" stroke="#495057" stroke-width="1.6" marker-end="url(#b)"/>

  <text x="620" y="440" text-anchor="middle" font-size="13" fill="#6c757d">Three criteria are measured on the prototypes, two are scored from published evidence, and the stakeholder ranking decides how much each one counts.</text>
</svg>
