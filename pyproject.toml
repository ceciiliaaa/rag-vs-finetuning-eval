[project]
name = "rag-ft-eval"
version = "0.2.0"
description = "Stakeholder-weighted utility analysis for comparing LLM domain-adaptation strategies, with a RAG vs. fine-tuning case study"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cecilia Nothstein" }]
keywords = ["mcda", "utility-analysis", "llm-evaluation", "rag", "fine-tuning", "kendalls-w"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
# Only needed to run the reference pipelines against real services; the evaluation framework,
# the tests and the offline demo do not use them.
rag = ["sentence-transformers>=3.0", "pinecone>=5.0"]
openai = ["openai>=1.40"]

[project.scripts]
rag-ft-eval = "rag_ft_eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ft_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
